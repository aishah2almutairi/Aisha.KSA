<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لو كانت السعودية معادلة؟</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f1ede2;
    }

    .page {
      width: 100vw;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f1ede2;
      overflow: hidden;
    }

    .image-box {
      position: relative;

      width: min(100vw, calc(100vh * 1280 / 669));
      aspect-ratio: 1280 / 669;

      flex-shrink: 0;
    }

    .main-image {
      width: 100%;
      height: 100%;

      display: block;
      object-fit: contain;
    }

    .start-btn {
  position: absolute;

  top: 57.8%;
  right: 55.6%;

  width: 15.6%;
  height: 7.6%;

  border: 0;
  border-radius: 50px;

  background: transparent;

  cursor: pointer;
  z-index: 999;

  display: block;

  transition: 0.2s;
}

    .start-btn:hover {
      background: #ffffff33;
      box-shadow: 0 0 15px #ffffff80;
    }

    .start-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="image-box">

      <img
        class="main-image"
        src="https://i.postimg.cc/D08LhGB6/1d3c26f0-4ba9-4d54-9625-8be34f424d8f.jpg"
        alt="لو كانت السعودية معادلة؟">

      <a
        class="start-btn"
        href="page2.html"
        title="ابدئي الرحلة">
      </a>

    </div>

  </div>

</body>
</html>
