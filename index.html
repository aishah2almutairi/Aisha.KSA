<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لو كانت السعودية معادلة؟</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f1ede2;
    }

    .page-background {
      width: 100vw;
      height: 100vh;

      background: url('https://i.postimg.cc/HLzpthdz/e89ee22f-b500-465d-b080-d6f317384c6b.jpg')
  center / 100% 100% no-repeat;

      position: relative;
    }

.start-btn {
  position: absolute;

  top: 57.3%;
  right: 56.5%;

  width: 14.8%;
  height: 6.4%;

  border: 0;
  border-radius: 50px;

  background: transparent;

  cursor: pointer;
  z-index: 999;

  display: block;

  transition: 0.2s;
}

    .start-btn:hover {
      background: #ffffff33;
      box-shadow: 0 0 15px #ffffff80;
    }

    .start-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <div class="page-background">

    <!-- زر الانتقال إلى الصفحة الثانية -->
    <a
      class="start-btn"

    </a>

  </div>

</body>
</html>
